version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  api-gateway:
    build: ./microservices/api-gateway
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - GATEWAY_PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - USER_SERVICE_URL=http://user-service:5002
      - DOCTOR_SERVICE_URL=http://doctor-service:5003
      - APPOINTMENT_SERVICE_URL=http://appointment-service:5004
      - SCHEDULE_SERVICE_URL=http://schedule-service:5005
      - PAYMENT_SERVICE_URL=http://payment-service:5006
      - NOTIFICATION_SERVICE_URL=http://notification-service:5007
      - CHAT_SERVICE_URL=http://chat-service:5008
    depends_on:
      - auth-service
      - user-service
      - doctor-service
      - appointment-service

  auth-service:
    build: ./microservices/auth-service
    container_name: auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/appointment_auth_db
      - JWT_SECRET=appointment_app_secret_key_123
    depends_on:
      - mongodb

  user-service:
    build: ./microservices/user-service
    container_name: user-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGODB_URI=mongodb://mongodb:27017/appointment_user_db
    depends_on:
      - mongodb

  doctor-service:
    build: ./microservices/doctor-service
    container_name: doctor-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://mongodb:27017/appointment_doctor_db
    depends_on:
      - mongodb

  appointment-service:
    build: ./microservices/appointment-service
    container_name: appointment-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGODB_URI=mongodb://mongodb:27017/appointment_booking_db
      - REDIS_URL=redis://redis:6379
      - NOTIFICATION_SERVICE_URL=http://notification-service:5007
    depends_on:
      - mongodb
      - redis

  schedule-service:
    build: ./microservices/schedule-service
    container_name: schedule-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGODB_URI=mongodb://mongodb:27017/appointment_schedule_db
    depends_on:
      - mongodb

  payment-service:
    build: ./microservices/payment-service
    container_name: payment-service
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - MONGODB_URI=mongodb://mongodb:27017/appointment_payment_db
    depends_on:
      - mongodb

  notification-service:
    build: ./microservices/notification-service
    container_name: notification-service
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - MONGODB_URI=mongodb://mongodb:27017/appointment_notification_db
    depends_on:
      - mongodb

  chat-service:
    build: ./microservices/chat-service
    container_name: chat-service
    ports:
      - "5008:5008"
    environment:
      - PORT=5008
      - MONGODB_URI=mongodb://mongodb:27017/appointment_chat_db
    depends_on:
      - mongodb

volumes:
  mongo_data:
