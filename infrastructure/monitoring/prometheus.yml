global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"

scrape_configs:
  - job_name: 'caresync-gateway'
    static_configs:
      - targets: ['api-gateway:5000']
    metrics_path: '/metrics'

  - job_name: 'caresync-mongodb'
    static_configs:
      - targets: ['mongodb:27017']

  - job_name: 'caresync-redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'caresync-nginx'
    static_configs:
      - targets: ['nginx:80']
